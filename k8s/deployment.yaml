apiVersion: apps/v1
kind: Deployment
metadata:
  name: mar-auth-proxy
  namespace: mar-system
  labels:
    app: mar-auth-proxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mar-auth-proxy
  template:
    metadata:
      labels:
        app: mar-auth-proxy
    spec:
      containers:
        # Container 1: Cloudflare Tunnel (Outbound Edge Tunnel)
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mar-auth-secrets
                  key: CLOUDFLARE_TUNNEL_TOKEN
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - $(TUNNEL_TOKEN)
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 2000m
              memory: 256Mi

        # Container 2: Caddy Reverse Proxy (Host Router & Forward Auth Enforcer)
        - name: caddy
          image: caddy:2-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              hostPort: 80
              name: http
            - containerPort: 443
              hostPort: 443
              name: https
          volumeMounts:
            - name: config-volume
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 2000m
              memory: 256Mi

        # Container 3: Authelia Authentication Server (SSO & Access Control)
        - name: authelia
          image: authelia/authelia:latest
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/authelia/configuration.yml
          ports:
            - containerPort: 9091
              name: auth-api
          volumeMounts:
            - name: config-volume
              mountPath: /etc/authelia/configuration.yml
              subPath: configuration.yml
            - name: users-secret-volume
              mountPath: /etc/authelia/users_database.yml
              subPath: users_database.yml
            - name: authelia-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 2000m
              memory: 512Mi

      volumes:
        - name: config-volume
          configMap:
            name: mar-auth-proxy-config
        - name: users-secret-volume
          secret:
            secretName: mar-auth-users
        - name: authelia-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mar-auth-proxy
  namespace: mar-system
  labels:
    app: mar-auth-proxy
spec:
  type: NodePort
  selector:
    app: mar-auth-proxy
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30088
    - name: https
      port: 443
      targetPort: 443
      nodePort: 30443
    - name: authelia
      port: 9091
      targetPort: 9091
      nodePort: 30091
